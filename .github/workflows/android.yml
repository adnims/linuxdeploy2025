name: Android Release

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 11
      uses: actions/setup-java@v5
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build debug APK
      run: ./gradlew assembleDebug

    - name: Rename APK
      run: cp app/build/outputs/apk/debug/app-debug.apk linuxdeploy2025-debug.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: debug
        name: Linux Deploy 2025 Debug
        prerelease: true
        files: linuxdeploy2025-debug.apk
